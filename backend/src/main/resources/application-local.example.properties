# Plantilla para desarrollo local.
# Copia este archivo como application-local.properties y reemplaza los valores CAMBIAR_*.
# application-local.properties esta ignorado por Git y puede contener credenciales reales.
# No pongas credenciales reales en este archivo de ejemplo.

spring.datasource.url=jdbc:postgresql://localhost:5432/regalia_db
spring.datasource.username=regalia_user
spring.datasource.password=CAMBIAR_PASSWORD_LOCAL

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT local. Debe ser una clave Base64 suficientemente larga para HS384.
# Ejemplo PowerShell:
# [Convert]::ToBase64String((1..48 | ForEach-Object { Get-Random -Minimum 0 -Maximum 256 }))
regalia.security.jwt.secret=CAMBIAR_JWT_SECRET_BASE64
regalia.security.jwt.issuer=regalia-backend
regalia.security.jwt.audience=regalia-api
regalia.security.jwt.public-expiration-minutes=240
regalia.security.jwt.admin-expiration-minutes=30

# Google SSO. Usa el Client ID OAuth creado en Google Cloud.
regalia.security.oauth.google.client-id=CAMBIAR_GOOGLE_CLIENT_ID
regalia.security.oauth.google.issuer=https://accounts.google.com

# Verificacion de correo local.
# El enlace abre el frontend; la pantalla /verificar-correo llama al backend para confirmar el token.
# La aplicacion agrega el token como fragmento (#token=...), nunca como query string.
# Si usas Nginx local, esta URL apunta al frontend unificado.
regalia.security.email-verification.confirmation-url=http://localhost:3000/verificar-correo
regalia.security.email-verification.expiration-minutes=1440

# Correo transaccional.
# LOG imprime enlaces en consola. SMTP envia correos reales con las credenciales configuradas abajo.
regalia.email.provider=LOG
regalia.email.from-address=no-reply@regalia.local
regalia.email.from-name=REGALIA

# SMTP real. Completar solo en application-local.properties si se cambia regalia.email.provider=SMTP.
spring.mail.host=CAMBIAR_SMTP_HOST
spring.mail.port=587
spring.mail.username=CAMBIAR_SMTP_USERNAME
spring.mail.password=CAMBIAR_SMTP_PASSWORD
spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=false
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Origenes permitidos para desarrollo local.
# Si usas Nginx local, agrega http://localhost:3000.
# Si usas ngrok, agrega el dominio temporal solo en application-local.properties.
regalia.security.cors.allowed-origins=http://localhost:4200,http://127.0.0.1:4200,http://localhost:3000,http://127.0.0.1:3000

# Headers de seguridad locales.
regalia.security.headers.referrer-policy=strict-origin-when-cross-origin
regalia.security.headers.permissions-policy=camera=(), microphone=(), geolocation=(), payment=()
regalia.security.headers.hsts-enabled=false
regalia.security.headers.hsts-max-age-seconds=31536000
regalia.security.headers.hsts-include-subdomains=true

# Pagos locales.
regalia.payments.gateway.default-provider=MERCADO_PAGO
regalia.payments.gateway.currency=PEN
regalia.payments.gateway.client-base-url=http://localhost:4200
regalia.payments.gateway.manual-allowed-methods=YAPE,PLIN,TRANSFERENCIA

# Mercado Pago sandbox. Copia credenciales reales solo en application-local.properties.
regalia.payments.gateway.mercado-pago.access-token=CAMBIAR_MERCADO_PAGO_ACCESS_TOKEN_TEST
regalia.payments.gateway.mercado-pago.public-key=CAMBIAR_MERCADO_PAGO_PUBLIC_KEY_TEST
regalia.payments.gateway.mercado-pago.sandbox-mode=true
regalia.payments.gateway.mercado-pago.api-base-url=https://api.mercadopago.com
regalia.payments.gateway.mercado-pago.success-url=http://localhost:4200/carrito?checkout=confirmacion&payment=success
regalia.payments.gateway.mercado-pago.failure-url=http://localhost:4200/carrito?checkout=confirmacion&payment=failure
regalia.payments.gateway.mercado-pago.pending-url=http://localhost:4200/carrito?checkout=confirmacion&payment=pending
regalia.payments.gateway.mercado-pago.notification-url=
regalia.payments.gateway.mercado-pago.statement-descriptor=REGALIA

# Consulta RUC. Mantener el token fuera de Git.
regalia.apisperu.ruc.url=https://dniruc.apisperu.com/api/v1/ruc
regalia.apisperu.ruc.token=CAMBIAR_APISPERU_RUC_TOKEN
regalia.apisperu.ruc.timeout-milliseconds=8000
regalia.apisperu.ruc.cache-ttl=PT24H
regalia.apisperu.ruc.cache-max-entries=10000
regalia.apisperu.ruc.quota-max-requests=2000
regalia.apisperu.ruc.quota-window=P30D
regalia.apisperu.ruc.quota-cooldown=PT0S

# Medios R2 para desarrollo. Copia secretos reales solo en application-local.properties.
# La URL publica pertenece a R2 (r2.dev o dominio propio), no a ngrok.
regalia.media.provider=R2
regalia.media.r2.bucket=CAMBIAR_R2_BUCKET
regalia.media.r2.endpoint=https://CAMBIAR_ACCOUNT_ID.r2.cloudflarestorage.com
regalia.media.r2.region=auto
regalia.media.r2.access-key-id=CAMBIAR_R2_ACCESS_KEY_ID
regalia.media.r2.secret-access-key=CAMBIAR_R2_SECRET_ACCESS_KEY
regalia.media.public-base-url=https://CAMBIAR_SUBDOMINIO.r2.dev
regalia.media.upload-url-expiration=PT10M
regalia.media.product-image.max-count=5
regalia.media.product-image.max-size-bytes=5242880

# Para pruebas locales con Mercado Pago + ngrok, reemplaza localhost:4200 por tu URL publica temporal
# SOLO en application-local.properties.
# Ejemplo:
# regalia.security.cors.allowed-origins=http://localhost:4200,http://127.0.0.1:4200,http://localhost:3000,http://127.0.0.1:3000,https://TU_DOMINIO_NGROK.ngrok-free.dev
# regalia.payments.gateway.mercado-pago.success-url=https://TU_DOMINIO_NGROK.ngrok-free.dev/carrito?checkout=confirmacion&payment=success
# regalia.payments.gateway.mercado-pago.failure-url=https://TU_DOMINIO_NGROK.ngrok-free.dev/carrito?checkout=confirmacion&payment=failure
# regalia.payments.gateway.mercado-pago.pending-url=https://TU_DOMINIO_NGROK.ngrok-free.dev/carrito?checkout=confirmacion&payment=pending
# regalia.payments.gateway.mercado-pago.notification-url=https://TU_DOMINIO_NGROK.ngrok-free.dev/api/webhooks/mercado-pago
# regalia.payments.gateway.client-base-url=https://TU_DOMINIO_NGROK.ngrok-free.dev
# regalia.security.email-verification.confirmation-url=https://TU_DOMINIO_NGROK.ngrok-free.dev/verificar-correo

# Builder IA mediante OpenRouter. Nunca guardar una clave real en este archivo.
regalia.builder-ia.base-url=https://openrouter.ai/api/v1
regalia.builder-ia.chat-completions-path=/chat/completions
regalia.builder-ia.model=openai/gpt-4o-mini
regalia.builder-ia.api-key=CAMBIAR_OPENROUTER_API_KEY
regalia.builder-ia.site-url=http://localhost:4200
regalia.builder-ia.app-name=REGALIA Local
regalia.builder-ia.connect-timeout-milliseconds=5000
regalia.builder-ia.read-timeout-milliseconds=20000
regalia.builder-ia.recommendation-max-tokens=500
regalia.builder-ia.chat-max-tokens=300
