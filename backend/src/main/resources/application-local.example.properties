# Plantilla para desarrollo local.
# Copia este archivo como application-local.properties y reemplaza los valores CAMBIAR_*.
# application-local.properties esta ignorado por Git y puede contener tus credenciales reales.
# No pongas credenciales reales en este archivo de ejemplo.

spring.datasource.url=jdbc:postgresql://localhost:5432/regalia_db
spring.datasource.username=regalia_user
spring.datasource.password=CAMBIAR_PASSWORD_LOCAL

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Debe ser una clave Base64 suficientemente larga para HS384.
# Ejemplo de generacion con PowerShell:
# [Convert]::ToBase64String((1..48 | ForEach-Object { Get-Random -Minimum 0 -Maximum 256 }))
regalia.security.jwt.secret=CAMBIAR_JWT_SECRET_BASE64
regalia.security.jwt.issuer=regalia-backend
regalia.security.jwt.audience=regalia-api
regalia.security.jwt.public-expiration-minutes=240
regalia.security.jwt.admin-expiration-minutes=30

# Origenes permitidos para desarrollo local.
# Si usas ngrok, agrega tu dominio temporal solo en application-local.properties.
regalia.security.cors.allowed-origins=http://localhost:4200,http://127.0.0.1:4200

# Si pruebas el frontend con ngrok, no guardes el host temporal en angular.json.
# Levanta Angular con este override local de PowerShell:
# $env:__VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS="TU_DOMINIO_NGROK.ngrok-free.dev"
# npm start

regalia.security.headers.referrer-policy=strict-origin-when-cross-origin
regalia.security.headers.permissions-policy=camera=(), microphone=(), geolocation=(), payment=()
regalia.security.headers.hsts-enabled=false
regalia.security.headers.hsts-max-age-seconds=31536000
regalia.security.headers.hsts-include-subdomains=true

# Pagos locales. MANUAL permite validar el flujo sin credenciales reales de pasarela.
regalia.payments.gateway.default-provider=MANUAL
regalia.payments.gateway.currency=PEN
regalia.payments.gateway.manual-allowed-methods=YAPE,PLIN,TRANSFERENCIA

# Mercado Pago sandbox. Copia tus credenciales reales solo en application-local.properties.
regalia.payments.gateway.mercado-pago.access-token=CAMBIAR_MERCADO_PAGO_ACCESS_TOKEN_TEST
regalia.payments.gateway.mercado-pago.public-key=CAMBIAR_MERCADO_PAGO_PUBLIC_KEY_TEST
regalia.payments.gateway.mercado-pago.api-base-url=https://api.mercadopago.com
regalia.payments.gateway.mercado-pago.success-url=http://localhost:4200/carrito?checkout=confirmacion&payment=success
regalia.payments.gateway.mercado-pago.failure-url=http://localhost:4200/carrito?checkout=confirmacion&payment=failure
regalia.payments.gateway.mercado-pago.pending-url=http://localhost:4200/carrito?checkout=confirmacion&payment=pending
# Para confirmar pagos reales en sandbox, usar una URL publica hacia el backend:
# https://TU_DOMINIO_PUBLICO/api/webhooks/mercado-pago
regalia.payments.gateway.mercado-pago.notification-url=
regalia.payments.gateway.mercado-pago.statement-descriptor=REGALIA
regalia.payments.gateway.mercado-pago.sandbox-mode=true

# Para pruebas locales con Mercado Pago + ngrok, reemplaza localhost:4200 por tu URL publica temporal
# SOLO en application-local.properties.
# Ejemplo:
# regalia.security.cors.allowed-origins=http://localhost:4200,http://127.0.0.1:4200,https://TU_DOMINIO_NGROK.ngrok-free.dev
# regalia.payments.gateway.mercado-pago.success-url=https://TU_DOMINIO_NGROK.ngrok-free.dev/carrito?checkout=confirmacion&payment=success
# regalia.payments.gateway.mercado-pago.failure-url=https://TU_DOMINIO_NGROK.ngrok-free.dev/carrito?checkout=confirmacion&payment=failure
# regalia.payments.gateway.mercado-pago.pending-url=https://TU_DOMINIO_NGROK.ngrok-free.dev/carrito?checkout=confirmacion&payment=pending
# regalia.payments.gateway.mercado-pago.notification-url=https://TU_DOMINIO_NGROK.ngrok-free.dev/api/webhooks/mercado-pago
