spring.application.name=regalia-backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}

regalia.security.jwt.secret=${JWT_SECRET}
regalia.security.jwt.issuer=${JWT_ISSUER:regalia-backend}
regalia.security.jwt.audience=${JWT_AUDIENCE:regalia-api}
regalia.security.jwt.public-expiration-minutes=${JWT_PUBLIC_EXPIRATION_MINUTES:240}
regalia.security.jwt.admin-expiration-minutes=${JWT_ADMIN_EXPIRATION_MINUTES:30}

# OAuth / SSO. El frontend envia ID tokens y el backend valida issuer/audience.
regalia.security.oauth.google.client-id=${GOOGLE_CLIENT_ID:}
regalia.security.oauth.google.issuer=${GOOGLE_ISSUER:https://accounts.google.com}

# Verificacion de correo local. El proveedor de email puede cambiar sin tocar el dominio.
regalia.security.email-verification.confirmation-url=${EMAIL_VERIFICATION_CONFIRMATION_URL:http://localhost:3000/verificar-correo}
regalia.security.email-verification.expiration-minutes=${EMAIL_VERIFICATION_EXPIRATION_MINUTES:1440}

# Recuperacion de contrasena local. El token se entrega solo por correo y expira pronto.
regalia.security.password-recovery.reset-url=${PASSWORD_RECOVERY_RESET_URL:http://localhost:3000/restablecer-contrasena}
regalia.security.password-recovery.expiration-minutes=${PASSWORD_RECOVERY_EXPIRATION_MINUTES:30}

# Correo transaccional. LOG conserva desarrollo local; SMTP habilita envio real.
regalia.email.provider=${EMAIL_PROVIDER:LOG}
regalia.email.from-address=${EMAIL_FROM_ADDRESS:no-reply@regalia.local}
regalia.email.from-name=${EMAIL_FROM_NAME:REGALIA}

spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.protocol=${SMTP_PROTOCOL:smtp}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS_REQUIRED:false}
spring.mail.properties.mail.smtp.connectiontimeout=${SMTP_CONNECTION_TIMEOUT:10000}
spring.mail.properties.mail.smtp.timeout=${SMTP_TIMEOUT:10000}
spring.mail.properties.mail.smtp.writetimeout=${SMTP_WRITE_TIMEOUT:10000}

regalia.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
regalia.security.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
regalia.security.cors.allowed-headers=Authorization,Content-Type,Accept
regalia.security.cors.exposed-headers=
regalia.security.cors.allow-credentials=false
regalia.security.cors.max-age-seconds=3600

regalia.security.headers.referrer-policy=strict-origin-when-cross-origin
regalia.security.headers.permissions-policy=camera=(), microphone=(), geolocation=(), payment=()
regalia.security.headers.hsts-enabled=${SECURITY_HSTS_ENABLED:false}
regalia.security.headers.hsts-max-age-seconds=${SECURITY_HSTS_MAX_AGE_SECONDS:31536000}
regalia.security.headers.hsts-include-subdomains=${SECURITY_HSTS_INCLUDE_SUBDOMAINS:true}

# Pagos. MANUAL mantiene el flujo temporal; MERCADO_PAGO prepara Checkout Pro sandbox.
regalia.payments.gateway.default-provider=${PAYMENT_GATEWAY_PROVIDER:MANUAL}
regalia.payments.gateway.currency=${PAYMENT_GATEWAY_CURRENCY:PEN}
regalia.payments.gateway.client-base-url=${PAYMENT_CLIENT_BASE_URL:http://localhost:4200}
regalia.payments.gateway.manual-allowed-methods=YAPE,PLIN,TRANSFERENCIA
regalia.payments.gateway.mercado-pago.access-token=${MERCADO_PAGO_ACCESS_TOKEN:}
regalia.payments.gateway.mercado-pago.public-key=${MERCADO_PAGO_PUBLIC_KEY:}
regalia.payments.gateway.mercado-pago.api-base-url=${MERCADO_PAGO_API_BASE_URL:https://api.mercadopago.com}
regalia.payments.gateway.mercado-pago.success-url=${MERCADO_PAGO_SUCCESS_URL:http://localhost:4200/carrito?checkout=confirmacion&payment=success}
regalia.payments.gateway.mercado-pago.failure-url=${MERCADO_PAGO_FAILURE_URL:http://localhost:4200/carrito?checkout=confirmacion&payment=failure}
regalia.payments.gateway.mercado-pago.pending-url=${MERCADO_PAGO_PENDING_URL:http://localhost:4200/carrito?checkout=confirmacion&payment=pending}
regalia.payments.gateway.mercado-pago.notification-url=${MERCADO_PAGO_NOTIFICATION_URL:}
regalia.payments.gateway.mercado-pago.statement-descriptor=${MERCADO_PAGO_STATEMENT_DESCRIPTOR:REGALIA}
regalia.payments.gateway.mercado-pago.sandbox-mode=${MERCADO_PAGO_SANDBOX_MODE:true}

# Rate limiting de login. No son secretos.
# per-identity = contexto + correo + IP. per-ip = contexto + IP.
regalia.security.login-attempts.public-login.per-identity.max-failed-attempts=5
regalia.security.login-attempts.public-login.per-identity.window-minutes=10
regalia.security.login-attempts.public-login.per-identity.block-minutes=10
regalia.security.login-attempts.public-login.per-ip.max-failed-attempts=30
regalia.security.login-attempts.public-login.per-ip.window-minutes=10
regalia.security.login-attempts.public-login.per-ip.block-minutes=10

regalia.security.login-attempts.admin-login.per-identity.max-failed-attempts=3
regalia.security.login-attempts.admin-login.per-identity.window-minutes=15
regalia.security.login-attempts.admin-login.per-identity.block-minutes=15
regalia.security.login-attempts.admin-login.per-ip.max-failed-attempts=15
regalia.security.login-attempts.admin-login.per-ip.window-minutes=15
regalia.security.login-attempts.admin-login.per-ip.block-minutes=15

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.port=${SERVER_PORT:8080}

# Builder IA / OpenRouter. La clave solo se inyecta mediante entorno o secreto.
regalia.builder-ia.base-url=${OPENROUTER_BASE_URL:https://openrouter.ai/api/v1}
regalia.builder-ia.chat-completions-path=${OPENROUTER_CHAT_COMPLETIONS_PATH:/chat/completions}
regalia.builder-ia.model=${OPENROUTER_MODEL:openai/gpt-4o-mini}
regalia.builder-ia.api-key=${OPENROUTER_API_KEY:}
regalia.builder-ia.site-url=${OPENROUTER_SITE_URL:}
regalia.builder-ia.app-name=${OPENROUTER_APP_NAME:REGALIA}
regalia.builder-ia.connect-timeout-milliseconds=${OPENROUTER_CONNECT_TIMEOUT_MILLISECONDS:5000}
regalia.builder-ia.read-timeout-milliseconds=${OPENROUTER_READ_TIMEOUT_MILLISECONDS:20000}
regalia.builder-ia.recommendation-max-tokens=${BUILDER_IA_RECOMMENDATION_MAX_TOKENS:500}
regalia.builder-ia.chat-max-tokens=${BUILDER_IA_CHAT_MAX_TOKENS:300}

# Consulta de RUC. El token debe definirse solo como variable de entorno o en application-local.properties.
regalia.apisperu.ruc.url=${APISPERU_RUC_URL:https://dniruc.apisperu.com/api/v1/ruc}
regalia.apisperu.ruc.token=${APISPERU_RUC_TOKEN:}
regalia.apisperu.ruc.timeout-milliseconds=${APISPERU_RUC_TIMEOUT_MILLISECONDS:8000}
regalia.apisperu.ruc.cache-ttl=${APISPERU_RUC_CACHE_TTL:PT24H}
regalia.apisperu.ruc.cache-max-entries=${APISPERU_RUC_CACHE_MAX_ENTRIES:10000}
regalia.apisperu.ruc.quota-max-requests=${APISPERU_RUC_QUOTA_MAX_REQUESTS:2000}
regalia.apisperu.ruc.quota-window=${APISPERU_RUC_QUOTA_WINDOW:P30D}
regalia.apisperu.ruc.quota-cooldown=${APISPERU_RUC_QUOTA_COOLDOWN:PT0S}

# Medios. Las credenciales R2 solo se inyectan por variables de entorno o application-local.properties.
# NONE permite iniciar entornos que aun no usan almacenamiento de objetos.
regalia.media.provider=${MEDIA_PROVIDER:NONE}
regalia.media.public-base-url=${MEDIA_PUBLIC_BASE_URL:}
regalia.media.upload-url-expiration=${MEDIA_UPLOAD_URL_EXPIRATION:PT10M}
regalia.media.public-object-cache-control=${MEDIA_PUBLIC_OBJECT_CACHE_CONTROL:public, max-age=31536000, immutable}
regalia.media.product-image.max-count=${MEDIA_PRODUCT_IMAGE_MAX_COUNT:5}
regalia.media.product-image.max-size-bytes=${MEDIA_PRODUCT_IMAGE_MAX_SIZE_BYTES:5242880}
regalia.media.r2.bucket=${R2_BUCKET:}
regalia.media.r2.endpoint=${R2_ENDPOINT:}
regalia.media.r2.region=${R2_REGION:auto}
regalia.media.r2.access-key-id=${R2_ACCESS_KEY_ID:}
regalia.media.r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}
