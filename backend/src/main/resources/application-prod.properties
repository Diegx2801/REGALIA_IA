# Produccion nunca debe enviar enlaces a localhost ni usar el emisor de logs.
# Las credenciales se inyectan mediante secretos/variables de entorno.
regalia.email.provider=SMTP
regalia.security.email-verification.confirmation-url=${EMAIL_VERIFICATION_CONFIRMATION_URL}
regalia.email.from-address=${EMAIL_FROM_ADDRESS}
regalia.email.from-name=${EMAIL_FROM_NAME:REGALIA}

spring.mail.host=${SMTP_HOST}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
