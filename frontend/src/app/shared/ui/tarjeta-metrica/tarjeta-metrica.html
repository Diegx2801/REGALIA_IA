<article class="tarjeta-metrica" [attr.aria-label]="etiqueta() + ': ' + (valor() ?? '')">
  <div class="flex items-start justify-between gap-3">
    <span class="text-[0.68rem] font-black tracking-[0.13em] text-regalia-muted uppercase">
      {{ etiqueta() }}
    </span>
    <span class="tarjeta-metrica__icono" aria-hidden="true">
      <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor">
        @switch (icono()) {
          @case ('tiendas') {
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="1.8"
              d="m4.5 9 1.2-4h12.6l1.2 4M5.5 10.5v8.75h13V10.5M9 19.25v-5.5h6v5.5M4.5 9a2.25 2.25 0 0 0 4.5 0 2.25 2.25 0 0 0 4.5 0A2.25 2.25 0 0 0 18 9"
            />
          }
          @case ('productos') {
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="1.8"
              d="m5 8 7-3.5L19 8l-7 3.5L5 8Zm0 0v8l7 3.5m0-8v8m7-11.5v8L12 19.5"
            />
          }
          @case ('pedidos') {
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="1.8"
              d="M7 4.75h10A2.25 2.25 0 0 1 19.25 7v12.25l-3-1.75-2.75 1.75-2.75-1.75-3 1.75V7A2.25 2.25 0 0 1 10 4.75ZM10 9h5M10 12.5h4"
            />
          }
          @case ('ingresos') {
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="1.8"
              d="M5 7.25h12.5A1.5 1.5 0 0 1 19 8.75v8.5a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 5 17.25v-10Zm0 2.5h14m-4 3.25h2"
            />
          }
          @case ('visibilidad') {
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="1.8"
              d="M3.75 12s3-5 8.25-5 8.25 5 8.25 5-3 5-8.25 5S3.75 12 3.75 12Zm8.25 2.25A2.25 2.25 0 1 0 12 9.75a2.25 2.25 0 0 0 0 4.5Z"
            />
          }
          @case ('alerta') {
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="1.8"
              d="M12 8v4.5m0 3h.01M10.05 4.6 3.8 16a2 2 0 0 0 1.75 3h12.9a2 2 0 0 0 1.75-3L13.95 4.6a2.2 2.2 0 0 0-3.9 0Z"
            />
          }
          @case ('pausa') {
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="1.8"
              d="M8.25 6.25v11.5m7.5-11.5v11.5"
            />
          }
          @default {
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="1.8"
              d="m5 15 4-4 3 3 7-7m-4 0h4v4"
            />
          }
        }
      </svg>
    </span>
  </div>
  <h3 class="mt-2.5 text-2xl leading-none font-black tracking-[-0.045em] text-regalia-ink">
    {{ valor() ?? '0' }}
  </h3>
  <p class="mt-1.5 text-[0.82rem] leading-5 text-regalia-muted">{{ descripcion() }}</p>
  <span class="tarjeta-metrica__regla" aria-hidden="true"></span>
</article>
