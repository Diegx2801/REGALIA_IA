<article
  class="tarjeta-metrica group relative h-full overflow-hidden rounded-regalia border border-regalia-primary/10 bg-white p-4 shadow-sm transition duration-200 hover:-translate-y-0.5 hover:border-regalia-primary/20 hover:shadow-regalia"
  [attr.aria-label]="etiqueta() + ': ' + (valor() ?? '')"
>
  <div class="flex items-start justify-between gap-3">
    <span class="text-[0.68rem] font-black tracking-[0.13em] text-regalia-muted uppercase">
      {{ etiqueta() }}
    </span>
    <span
      class="grid size-7 shrink-0 place-items-center rounded-lg bg-regalia-primary-soft text-regalia-primary transition group-hover:bg-regalia-primary group-hover:text-white"
      aria-hidden="true"
    >
      <svg class="size-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="1.8"
          d="m5 15 4-4 3 3 7-7m-4 0h4v4"
        />
      </svg>
    </span>
  </div>
  <h3 class="mt-3 text-2xl leading-none font-black tracking-[-0.045em] text-regalia-ink">
    {{ valor() ?? '0' }}
  </h3>
  <p class="mt-2 text-sm leading-5 text-regalia-muted">{{ descripcion() }}</p>
  <span class="absolute inset-x-4 bottom-0 h-0.5 rounded-full bg-regalia-gold opacity-60"></span>
</article>
