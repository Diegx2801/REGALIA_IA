<span
  class="insignia-ui inline-flex items-center gap-1.5 rounded-full px-2.5 py-1 text-[0.68rem] leading-none font-black tracking-[0.04em] whitespace-nowrap"
  [class.insignia-ui--primaria]="variante() === 'primaria'"
  [class.insignia-ui--exito]="variante() === 'exito'"
  [class.insignia-ui--advertencia]="variante() === 'advertencia'"
  [class.insignia-ui--error]="variante() === 'error'"
>
  <span class="insignia-ui__punto size-1.5 rounded-full bg-current" aria-hidden="true"></span>
  {{ texto() }}
</span>
