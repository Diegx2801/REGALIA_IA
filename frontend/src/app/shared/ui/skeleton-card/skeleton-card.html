<!-- Skeleton puramente visual: no representa datos reales ni dispara logica de negocio. -->
<article
  class="skeleton-card"
  [class.skeleton-card--tienda]="variante() === 'tienda'"
  [class.skeleton-card--compacto]="variante() === 'compacto'"
  aria-hidden="true"
>
  <span></span>
  <div></div>
  <div></div>
</article>
