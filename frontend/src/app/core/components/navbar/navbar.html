<nav class="regalia-navbar" aria-label="Navegación principal">
  <div class="container regalia-navbar__inner">
    <a
      class="regalia-navbar__brand"
      routerLink="/"
      (click)="closeMenu()"
      aria-label="REGALIA inicio"
    >
      <span class="regalia-navbar__brand-media" aria-hidden="true">
        <img class="regalia-navbar__brand-image" src="/images/r_regalia.png" alt="" />
      </span>
    </a>

    <button
      class="regalia-navbar__toggle"
      [class.regalia-navbar__toggle--open]="isMenuOpen()"
      type="button"
      aria-controls="regalia-navbar-menu"
      [attr.aria-expanded]="isMenuOpen()"
      aria-label="Abrir menú"
      (click)="toggleMenu()"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

    <div
      id="regalia-navbar-menu"
      class="regalia-navbar__menu"
      [class.regalia-navbar__menu--open]="isMenuOpen()"
    >
      <div class="regalia-navbar__links">
        @for (item of navItems; track item.route) {
          <a
            class="regalia-navbar__link"
            routerLinkActive="regalia-navbar__link--active"
            [routerLinkActiveOptions]="{ exact: item.route === '/' }"
            [routerLink]="item.route"
            (click)="closeMenu()"
          >
            {{ item.label }}
          </a>
        }
      </div>

      <div class="regalia-navbar__actions">
        <a class="regalia-navbar__cart" routerLink="/carrito" (click)="closeMenu()" aria-label="Ver carrito">
          <span aria-hidden="true">🛍️</span>
          Carrito
          @if (cartTotalItems() > 0) {
            <strong>{{ cartTotalItems() }}</strong>
          }
        </a>

        @if (isLoggedIn()) {
          <div class="regalia-navbar__session">
            <strong>{{ currentUser()?.fullName }}</strong>
            <span>{{ currentUser()?.role }}</span>
          </div>
          <a
            class="regalia-navbar__workspace"
            [routerLink]="workspaceRoute()"
            (click)="closeMenu()"
          >
            Mi espacio
          </a>
          <button class="regalia-navbar__logout" type="button" (click)="logout()">Salir</button>
        } @else {
          <a
            class="regalia-navbar__login"
            routerLink="/login"
            routerLinkActive="regalia-navbar__login--active"
            (click)="closeMenu()"
          >
            Ingresar
          </a>
        }

        <a class="regalia-navbar__cta" routerLink="/pedir-con-ia" (click)="closeMenu()">
          <span aria-hidden="true">✦</span>
          Crear solicitud
        </a>
      </div>
    </div>
  </div>
</nav>
