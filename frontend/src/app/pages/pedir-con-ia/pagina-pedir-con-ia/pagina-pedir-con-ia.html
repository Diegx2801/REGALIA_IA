<section class="builder-page">
  <div class="rg-page__container--retail builder-page__container">
    <app-hero-builder-ia />

    @if (!puedeUsarIa()) {
      <app-acceso-builder-ia />
    } @else {
      <app-pasos-builder-ia
        [pasos]="pasos"
        [pasoActual]="pasoActual()"
        (irAPaso)="irAPaso($event)"
      />

      @if (mensajeError()) {
        <app-estado-pantalla
          tipo="error"
          etiqueta="No se completó la consulta"
          titulo="La asistencia inteligente no respondió como esperábamos"
          [descripcion]="mensajeError()"
          textoAccion="Intentar nuevamente"
          (accion)="reintentar()"
        />
      }

      <div class="builder-shell">
        @if (pasoActual() === 1) {
          <app-fase-necesidad-ia
            [formulario]="formulario"
            [descripcionActual]="descripcionActual()"
            [cargando]="cargandoRecomendaciones()"
            (continuar)="continuar()"
          />
        }

        @if (pasoActual() === 2) {
          <app-fase-recomendaciones-ia
            [respuestaIa]="respuestaIa()"
            [descripcionActual]="descripcionActual()"
            [productos]="productosRecomendados()"
            [productoSeleccionado]="productoSeleccionado()"
            (seleccionarProducto)="seleccionarProducto($event)"
            (ajustarSolicitud)="ajustarSolicitud()"
            (buscarEnCatalogo)="buscarEnCatalogo()"
            (volver)="volver()"
            (continuar)="continuar()"
          />
        }

        @if (pasoActual() === 3) {
          <app-fase-reserva-ia
            [productoSeleccionado]="productoSeleccionado()"
            [mensajeExito]="mensajeExito()"
            [productoAgregado]="productoAgregado()"
            (buscarEnCatalogo)="buscarEnCatalogo()"
            (volver)="volver()"
            (confirmarSolicitud)="confirmarSolicitud()"
            (irAlCarrito)="irAlCarrito()"
          />
        }
      </div>

      <footer class="builder-footer-progress" aria-live="polite">
        <span>Paso {{ pasoActual() }} de 3</span>
      </footer>
    }
  </div>
</section>
