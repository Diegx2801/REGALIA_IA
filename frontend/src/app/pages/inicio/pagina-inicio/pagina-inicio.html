<div class="landing-page">
  <app-hero-inicio
    [controlBusqueda]="controlBusqueda"
    [categorias]="categorias()"
    [cargandoCategorias]="cargandoCategorias()"
    [mensajeErrorCategorias]="mensajeErrorCategorias()"
    (buscarRegalos)="buscarRegalos()"
    (buscarCategoria)="buscarCategoria($event)"
    (reintentarCategorias)="cargarCategorias()"
  />

  <app-destacados-inicio
    [tiendas]="tiendasDestacadas()"
    [productos]="productosDestacados()"
    [cargandoTiendas]="cargandoTiendasDestacadas()"
    [cargandoProductos]="cargandoProductosDestacados()"
    [mensajeErrorTiendas]="mensajeErrorTiendasDestacadas()"
    [mensajeErrorProductos]="mensajeErrorProductosDestacados()"
    [mensajeCarrito]="mensajeCarrito()"
    (explorarTienda)="explorarTienda($event)"
    (agregarProducto)="agregarAlCarrito($event)"
    (reintentarTiendas)="cargarTiendasDestacadas()"
    (reintentarProductos)="cargarProductosDestacados()"
  />

  <app-calendario-comercial [campanas]="campanas" [meses]="meses" [diasSemana]="diasSemana" />

  <app-modelo-negocio-inicio [pasos]="pasosModeloNegocio" />
  <app-cta-vendedor-inicio />
</div>
